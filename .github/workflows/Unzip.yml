name: Auto Unzip
on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract project without workflows
        run: |
          unzip -o "*.zip"
          rm -rf DLS26-Tactical-AutoBot/.github
          cp -r DLS26-Tactical-AutoBot/. .
          rm -rf DLS26-Tactical-AutoBot *.zip .github/workflows/unzip.yml
      - name: Push extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract project files"
          git push
